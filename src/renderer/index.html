<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; connect-src 'none'"
    />
    <title>Relay</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Relay</h1>
        <button id="settings-button" type="button" aria-label="Instellingen">⚙ Geheugen</button>
      </header>
      <main id="messages" aria-live="polite"></main>
      <form id="chat-form">
        <textarea id="chat-input" placeholder="Stel een vraag..." rows="2"></textarea>
        <button type="submit" id="send-button">Verstuur</button>
      </form>
    </div>

    <dialog id="settings-dialog">
      <h2>Geheugen</h2>
      <p class="settings-hint">Feiten die Relay onthoudt en in elk gesprek meestuurt.</p>
      <p id="settings-error" class="settings-error" hidden></p>
      <ul id="facts-list"></ul>
      <form id="add-fact-form">
        <input type="text" id="new-fact-input" placeholder="Nieuw feit..." maxlength="500" />
        <button type="submit">Toevoegen</button>
      </form>
      <div class="dialog-actions">
        <button id="close-settings-button" type="button">Sluiten</button>
      </div>
    </dialog>

    <script src="./renderer.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
